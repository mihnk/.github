name: Bug report
description: Report something that is not working as expected.
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here.
        Send them privately to [security@mihnk.org](mailto:security@mihnk.org) instead.

  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing issues
      options:
        - label: I have searched the existing issues.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run '...'
        2. Open '...'
        3. See the error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions, operating system, and anything else relevant.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Anything else?
      description: Logs, screenshots, or other context.
    validations:
      required: false
